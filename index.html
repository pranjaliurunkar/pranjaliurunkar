
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embedded Google Map</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="map-container">
        <iframe src="https://www.google.com/maps/embed?pb=YOUR_MAP_EMBED_URL"
                width="100%"
                height="500"
                style="border:0;"
                allowfullscreen=""
                loading="lazy">
        </iframe>
    </div>
</body>
</html>
